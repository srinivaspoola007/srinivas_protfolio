<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design Projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
font-family: Arial;
background: #0f172a;
color: white;
padding: 20px;
}

h1 {
text-align: center;
color: #38bdf8;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
gap: 12px;
}

.card {
background: #1e293b;
padding: 10px;
border-radius: 10px;
cursor: pointer;
}

.card img {
width: 100%;
border-radius: 8px;
}

.modal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.9);
justify-content: center;
align-items: center;
}

.modal img {
max-width: 90%;
max-height: 90%;
}

.close {
position: absolute;
top: 20px;
right: 30px;
font-size: 30px;
cursor: pointer;
}

.back {
display: block;
text-align: center;
margin-top: 20px;
color: #38bdf8;
}
</style>

</head>
<body>

<h1>🎨 Design Projects</h1>

<div class="grid">

<div class="card">
<img src="design1.jpg" onclick="openImg(this.src)">
</div>

<div class="card">
<img src="design2.jpg" onclick="openImg(this.src)">
</div>

<div class="card">
<img src="design3.jpg" onclick="openImg(this.src)">
</div>

<div class="card">
<img src="design4.jpg" onclick="openImg(this.src)">
</div>

</div>

<div class="modal" id="modal" onclick="closeImg()">
<span class="close">×</span>
<img id="img">
</div>

<a class="back" href="index.html">← Back</a>

<script>
function openImg(src){
document.getElementById("modal").style.display="flex";
document.getElementById("img").src=src;
}
function closeImg(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
