<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Projects</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        /* FULLSCREEN VIEW */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>

<body>
    

<h1>🎨 Design Projects (Canva)</h1>

<!-- IMAGE GRID -->
<div class="grid">

    <!-- Replace src with your Canva exported images -->
    <div class="card">
        <img src="design1.jpg" onclick="openImage(this.src)">
        <p>Project 1</p>
    </div>

    <div class="card">
        <img src="design2.jpg" onclick="openImage(this.src)">
        <p>Project 2</p>
    </div>

    <div class="card">
        <img src="design3.jpg" onclick="openImage(this.src)">
        <p>Project 3</p>
    </div>

    <div class="card">
        <img src="design4.jpg" onclick="openImage(this.src)">
        <p>Project 4</p>
    </div>
    
</div>
<!-- BACK BUTTON (CENTER BOTTOM) -->
<div class="back-wrapper">
    <a href="index.html" class="back-btn">← Back to Portfolio</a>
</div>
<!-- MODAL VIEW -->
<div class="modal" id="modal">
    <span class="close" onclick="closeImage()">×</span>
    <img id="modalImg">
</div>

<script>
function openImage(src) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeImage() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
